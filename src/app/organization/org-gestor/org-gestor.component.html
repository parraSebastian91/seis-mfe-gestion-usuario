<div class="gestor-shell">

  <!-- ── Loading ─────────────────────────────────────────────────────────── -->
  <div class="shell-loading" *ngIf="loading">
    <app-loader [size]="44" />
  </div>

  <!-- ── Error ────────────────────────────────────────────────────────────── -->
  <div class="shell-error" *ngIf="!loading && generalError">
    <app-icon name="error_outline" size="40" />
    <p>{{ generalError }}</p>
    <button app-button variant="light" (click)="goBack()">Volver</button>
  </div>

  <ng-container *ngIf="!loading && !generalError">

    <div class="gestor-card">

      <!-- ── Header ─────────────────────────────────────────────────────────── -->
      <header class="shell-header">
        <button app-icon-button size="md" class="back-btn" (click)="goBack()" aria-label="Volver">
          <app-icon name="arrow_back" />
        </button>
        <div class="shell-header__info">
          <span class="shell-header__label">Gestión de organización</span>
          <h1 class="shell-header__name">{{ org?.razonSocial }}</h1>
        </div>
      </header>

      <!-- ── Body: sidenav (desktop) + content ─────────────────────────────── -->
      <div class="shell-body">

        <!-- Desktop side nav -->
        <nav class="shell-sidenav" aria-label="Secciones de administración">
          <a
            *ngFor="let item of navItems"
            class="sidenav-item"
            [class.is-active]="isNavActive(item.path)"
            [routerLink]="item.path">
            <app-icon class="sidenav-item__icon" [name]="item.icon" />
            <span class="sidenav-item__label">{{ item.label }}</span>
          </a>
        </nav>

        <!-- Content area -->
        <main class="shell-content">
          <router-outlet></router-outlet>
        </main>

      </div>

    </div><!-- /gestor-card -->

    <!-- Mobile bottom nav (fixed, outside card) -->
    <nav class="shell-bottom-nav" aria-label="Navegación de secciones">
      <a
        *ngFor="let item of navItems"
        class="bottom-nav-item"
        [class.is-active]="isNavActive(item.path)"
        [routerLink]="item.path">
        <app-icon [name]="item.icon" size="22" />
        <span>{{ item.label }}</span>
      </a>
    </nav>

  </ng-container>

</div>
