<div class="org-list-container">

  <!-- ── Header ───────────────────────────────────────────────── -->
  <div class="org-list-header">
    <div>
      <h1 class="org-list-title">Mis Organizaciones</h1>
      <p class="org-list-subtitle">Gestiona las organizaciones a las que perteneces.</p>
    </div>
    <button app-button variant="primary" (click)="goToWizard()">
      <app-icon name="add" size="18" />
      Nueva organización
    </button>
  </div>

  <!-- ── Loading ──────────────────────────────────────────────── -->
  <div *ngIf="loading" class="state-container" aria-live="polite" aria-busy="true">
    <app-loader [size]="48" />
    <p>Cargando organizaciones…</p>
  </div>

  <!-- ── Error ────────────────────────────────────────────────── -->
  <div *ngIf="!loading && error" class="state-container error-state" role="alert">
    <app-icon name="error_outline" size="48" />
    <p>{{ error }}</p>
    <button app-button variant="light" (click)="loadOrganizations()">Reintentar</button>
  </div>

  <!-- ── Empty state ──────────────────────────────────────────── -->
  <div *ngIf="!loading && !error && organizations.length === 0" class="state-container empty-state">
    <app-icon class="empty-icon" name="business" size="64" />
    <h2>Aún no tienes organizaciones</h2>
    <p>Crea tu primera organización para comenzar a operar en la plataforma.</p>
    <button app-button variant="primary" (click)="goToWizard()">
      <app-icon name="add" size="18" />
      Crear organización
    </button>
  </div>

  <!-- ── Org grid ─────────────────────────────────────────────── -->
  <div *ngIf="!loading && !error && organizations.length > 0" class="orgs-grid">
    <app-card
      *ngFor="let org of organizations"
      class="org-card"
      role="button"
      tabindex="0"
      (click)="goToOrg(org.id)"
      (keydown.enter)="goToOrg(org.id)"
      (keydown.space)="goToOrg(org.id)"
      [attr.aria-label]="org.nombre">

      <!-- Card header with logo -->
      <div card-title class="org-card-header">
        <img
          [src]="org.logoUrl || 'assets/icons/org-placeholder.svg'"
          [alt]="org.nombre + ' logo'"
          class="org-avatar">
        <div>
          <h3 class="org-card-title">{{ org.nombre }}</h3>
          <p class="org-card-subtitle">{{ org.rut }}</p>
        </div>
      </div>

      <div class="chip-row">
        <span *ngIf="org.tipo" class="tipo-chip" [class]="'tipo-chip--' + org.tipo.toLowerCase()">
          {{ org.tipo }}
        </span>
        <span
          *ngIf="org.estado === 'ONBOARDING_INCOMPLETO'"
          class="estado-chip estado-chip--incomplete">
          <app-icon name="pending" size="14" />
          Registro incompleto
        </span>
      </div>

      <div card-footer>
        <button
          app-button
          variant="light"
          *ngIf="org.estado === 'ONBOARDING_INCOMPLETO'"
          (click)="resumeWizard(); $event.stopPropagation()"
          (keydown.enter)="$event.stopPropagation()"
          (keydown.space)="$event.stopPropagation()">
          <app-icon name="play_arrow" size="18" />
          Continuar registro
        </button>
        <button
          app-button
          variant="light"
          (click)="goToOrg(org.id); $event.stopPropagation()"
          (keydown.enter)="$event.stopPropagation()"
          (keydown.space)="$event.stopPropagation()">
          <app-icon name="arrow_forward" size="18" />
          Ver perfil
        </button>
      </div>
    </app-card>
  </div>

</div>
